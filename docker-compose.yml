services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidtip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidtip}
      POSTGRES_DB: ${POSTGRES_DB:-aidtip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidtip} -d ${POSTGRES_DB:-aidtip}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aidtip:aidtip@postgres:5432/aidtip}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RULES_CONFIG_PATH: ${RULES_CONFIG_PATH:-backend/detection/rules}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  postgres_data:
